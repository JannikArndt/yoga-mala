# Dependabot's pull requests merge themselves once the same checks a push
# runs have passed, then deploy. A merge made with the workflow token does not
# trigger push workflows, so the deploy is started explicitly.
name: Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/verify.py
      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPLOY_WORKFLOW: pages.yml
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          if [ -n "$DEPLOY_WORKFLOW" ]; then gh workflow run "$DEPLOY_WORKFLOW" --ref main -R "$GITHUB_REPOSITORY"; fi
